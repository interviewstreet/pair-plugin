[project]
name = "pair"
version = "0.1.0"
description = "Review sessions for GitHub PRs, seeded with the context of the agent sessions that built them"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "claude-agent-sdk>=0.1",
    "unidiff>=0.7.5",
    "rank-bm25>=0.2.2",
]

[project.scripts]
pair-brief = "pair.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: reads the real session stores in ~/.claude and ~/.codex, and calls gh or the Claude API"]
addopts = "-m 'not local'"
