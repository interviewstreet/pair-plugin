<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pair review</title>
<style>
  body { font: 14px/1.45 -apple-system, system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
  main { overflow: auto; padding: 16px 24px; }
  aside { border-left: 1px solid #ddd; display: flex; flex-direction: column; min-height: 0; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 14px; margin: 18px 0 6px; text-transform: uppercase; color: #555; }
  .muted { color: #777; } .item { margin: 4px 0 8px; } .ref { font: 12px ui-monospace, monospace; color: #0550ae; cursor: pointer; margin-right: 6px; }
  .status { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #eee; margin-right: 6px; }
  .failed, .never_run { background: #ffd8d3; } .stale { background: #fff1c2; } .passed { background: #d6f5d6; }
  pre { white-space: pre-wrap; background: #f6f8fa; padding: 8px; font-size: 12px; max-height: 40vh; overflow: auto; }
  #chat { flex: 1; overflow: auto; padding: 12px; } #chat div { margin-bottom: 10px; white-space: pre-wrap; }
  .user { font-weight: 600; } .tool { color: #777; font-size: 12px; } .err { color: #b00; }
  form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #ddd; } textarea { flex: 1; height: 60px; }
  .draft { border: 1px solid #ddd; padding: 6px; margin: 6px 0; }
</style>
</head>
<body>
<main id="main"><p class="muted">Loading…</p></main>
<aside><div id="chat"></div>
  <form id="f"><textarea id="t" placeholder="Ask the pair agent about this PR"></textarea>
    <div><button>Send</button><br><button type="button" id="stop">Stop</button></div></form></aside>
<script>
const key = new URLSearchParams(location.search).get("key");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const api = (p, o) => fetch(`/api/reviews/${key}${p}`, o).then((r) => r.ok ? r.json() : r.text().then((t) => Promise.reject(t)));

async function list() {
  const rs = await fetch("/api/reviews").then((r) => r.json());
  $("#main").innerHTML = "<h1>Reviews</h1>" + rs.map((r) =>
    `<div class="item"><a href="?key=${r.key}">${esc(r.repo)}#${r.number}</a> ${esc(r.title)} <span class="muted">${r.pending_count ? "writing…" : ""}</span></div>`).join("");
  document.querySelector("aside").hidden = true;
}

function refs(item) {
  return (item.refs || []).map((r) => `<span class="ref" data-ref="${esc(r)}">${esc(r)}</span>`).join("");
}

async function render() {
  const [meta, brief, drafts] = await Promise.all([api(""), api("/brief"), api("/drafts")]);
  const s = brief.sections || {};
  const sec = (name, title) => (s[name] || []).length === 0 ? "" : `<h2>${title}</h2>` + s[name].map((it) =>
    `<div class="item">${it.status ? `<span class="status ${it.status}">${it.status}</span>` : ""}${it.kind ? `<span class="status">${it.kind}</span>` : ""}${esc(it.text)}${it.superseded ? ' <span class="muted">(superseded)</span>' : ""}<br>${refs(it)}</div>`).join("");
  $("#main").innerHTML = `<h1>${esc(meta.pr.repo)}#${meta.pr.number}: ${esc(meta.pr.title)}</h1>
    <div class="muted">${meta.sessions.map((x) => `${x.agent}:${x.id.slice(0, 8)} ${x.role}`).join(" · ")}
    ${brief.pending?.length ? ` · writing: ${brief.pending.join(", ")}` : ""}</div>
    ${sec("summary", "Summary")}${sec("look_first", "Look first")}${sec("ask", "What was asked")}
    ${sec("verification", "Verification")}${sec("side_effects", "Side effects")}${sec("plan_vs_result", "Plan vs result")}
    ${sec("pushback", "Pushback")}${sec("decisions", "Decisions")}${sec("churn", "Churn")}${sec("loose_ends", "Loose ends")}
    <div id="excerpt"></div>
    <h2>Drafts</h2>${drafts.map((d) => `<div class="draft"><b>${esc(d.path)}:${d.line}</b> <span class="status">${d.status}</span><br>${esc(d.body)}<br>
      ${d.status === "posted" ? `<a href="${d.review_url}">posted</a>` : `<button data-d="${d.id}" data-s="approved">Approve</button> <button data-d="${d.id}" data-s="discarded">Discard</button>`}</div>`).join("") || '<p class="muted">None yet.</p>'}
    ${meta.can_post ? `<button id="post">Post approved drafts as ${esc(meta.post_account)}</button>` : '<p class="muted">Posting is off for this repo.</p>'}
    <p><a href="/api/reviews/${key}/diff">Raw diff</a></p>`;
  if (brief.pending?.length) setTimeout(render, 3000);
}

document.addEventListener("click", async (e) => {
  const ref = e.target.dataset?.ref;
  if (ref) {
    if (!/^(claude|codex):|^pr:body$/.test(ref)) { $("#excerpt").innerHTML = `<pre>${esc(ref)} is in the diff.</pre>`; return; }
    const x = await api(`/excerpt?ref=${encodeURIComponent(ref)}`).catch((err) => ({messages: [{role: "error", text: err}]}));
    $("#excerpt").innerHTML = `<h2>${esc(ref)}</h2><pre>${x.messages.map((m) => `[${m.role}] ${esc(m.text)}`).join("\n\n")}</pre>`;
  } else if (e.target.dataset?.d) {
    await api(`/drafts/${e.target.dataset.d}`, {method: "PATCH", headers: {"content-type": "application/json"}, body: JSON.stringify({status: e.target.dataset.s})});
    render();
  } else if (e.target.id === "post") {
    const r = await api("/post", {method: "POST"}).catch((err) => ({error: err}));
    alert(r.review_url || r.error); render();
  }
});

function chat() {
  const ws = new WebSocket(`ws://${location.host}/api/reviews/${key}/chat`);
  const box = $("#chat");
  const add = (cls, text, id) => { const d = document.createElement("div"); d.className = cls; if (id) d.id = "m-" + id; d.textContent = text; box.append(d); box.scrollTop = 1e9; return d; };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "history") { box.innerHTML = ""; m.messages.forEach((h) => add(h.role, h.role === "draft" ? `draft on ${h.draft.path}:${h.draft.line}` : h.text ?? h.summary, h.id)); }
    else if (m.type === "assistant_text") { (document.getElementById("m-" + m.message_id) || add("assistant", "", m.message_id)).textContent += m.text; box.scrollTop = 1e9; }
    else if (m.type === "tool_use") add("tool", m.summary);
    else if (m.type === "draft") { add("tool", `drafted a comment on ${m.draft.path}:${m.draft.line}`); render(); }
    else if (m.type === "turn_done") add("tool", `done in ${m.duration_s}s` + (m.cost_usd != null ? `, $${m.cost_usd.toFixed(3)}` : ""));
    else if (m.type === "error") add("err", m.message);
  };
  ws.onclose = () => setTimeout(chat, 2000);
  $("#f").onsubmit = (e) => { e.preventDefault(); const text = $("#t").value.trim(); if (!text) return; add("user", text); ws.send(JSON.stringify({type: "user_message", text, selection: null})); $("#t").value = ""; };
  $("#stop").onclick = () => ws.send(JSON.stringify({type: "interrupt"}));
}

if (key) { render(); chat(); } else list();
</script>
</body>
</html>
