name: Release paircli

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: paircli-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'interviewstreet/pair-plugin'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test plugin
        run: |
          python -m pip install "pytest>=8"
          python -m pytest
      - name: Test CLI
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
      - name: Build release artifacts
        run: |
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          bash cli/scripts/build-release-artifacts.sh "$VERSION"
          python3 scripts/check-release-artifacts.py cli/dist/paircli/latest.json
      - name: Test real binaries in isolated homes
        run: PAIRCLI_TEST_RELEASE_DIR=cli/dist/paircli python -m pytest tests/test_release_binary.py -q
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            cli/dist/paircli/${{ env.RELEASE_VERSION }}/*
            cli/dist/paircli/latest.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/dist/paircli/${{ env.RELEASE_VERSION }}/*
            cli/dist/paircli/latest.json
          fail_on_unmatched_files: true
